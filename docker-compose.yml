services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetings
    ports:
      - "5433:5432"          # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetings"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meetings
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JSON_LOGS: ${JSON_LOGS:-true}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-meeting-intelligence}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app          # live reload while developing
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
