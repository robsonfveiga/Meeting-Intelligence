name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetings"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetings
      UPLOAD_DIR: /tmp/uploads
      JSON_LOGS: "false"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build is the real check: it runs tsc over everything the bundle
      # touches and fails on an unresolvable import that lint alone would miss.
      - name: Build
        run: npm run build

      # `schema.d.ts` is committed so the bundle builds without a running backend.
      # Proving it still matches the live API would mean booting the whole stack in
      # this job; until that is worth the minutes, `make web-types` regenerates it
      # and the build catches a mismatch the moment a field is actually used.
