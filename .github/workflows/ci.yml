name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetings"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetings
      UPLOAD_DIR: /tmp/uploads
      JSON_LOGS: "false"
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q
