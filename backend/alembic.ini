# Deliberately minimal. The generated default carries ~28 lines of logging
# configuration we do not use — structlog handles application logging, and
# Alembic's own output is set up in env.py instead.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Intentionally unset: the URL comes from app settings unless a caller
# overrides it programmatically (the test suite migrates its own database).
sqlalchemy.url =
