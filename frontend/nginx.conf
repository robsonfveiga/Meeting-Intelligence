server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A single-page application: any unknown path is a route, not a missing file.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API, so the browser never needs a CORS preflight and the bundle
    # holds no environment-specific host.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;

        # Server-Sent Events: buffering here would hold the answer back until it
        # finished, which defeats the whole point of streaming it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
